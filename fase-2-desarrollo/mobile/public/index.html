<!DOCTYPE html>

    <title>%WEB_TITLE%</title>
    <!-- Reset recomendado por react-native-web. El fondo oscuro evita un destello blanco al cargar (DESIGN.md §9). -->

      html,
      body {
        height: 100%;
        background-color: #1a1a1a;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Kancha necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
