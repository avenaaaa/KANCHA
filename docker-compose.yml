# Kancha - levanta la base de datos, la API y la version web con un solo comando:
#   docker compose up --build
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kancha-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kancha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kancha}
      POSTGRES_DB: ${POSTGRES_DB:-kancha}
    # Solo desde este equipo: la base usa la clave de ejemplo y no debe verse en la red.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kancha-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kancha} -d ${POSTGRES_DB:-kancha}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./fase-2-desarrollo/backend
    container_name: kancha-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Demo local: recarga los datos de demostración en cada arranque y acepta la clave JWT de ejemplo.
      # En un despliegue real no se define, y la API se niega a arrancar con esa clave.
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-kancha}:${POSTGRES_PASSWORD:-kancha}@db:5432/${POSTGRES_DB:-kancha}
      JWT_SECRET: ${JWT_SECRET:-cambiar-esta-clave-en-produccion-kancha}
      PORT: 3000
      API_BASE_URL: http://localhost:3000
      TBK_ENV: ${TBK_ENV:-integration}
      # Vacía: Transbank vuelve a la dirección por la que llegó la app (sirve en el PC y en el celular).
      TBK_RETURN_URL: ${TBK_RETURN_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Migraciones versionadas (prisma/migrations), nunca "db push": asi la base de la demo,
    # la del CI y la de la nube tienen exactamente el mismo esquema.
    command: >
      sh -c "npx prisma migrate deploy &&
             (npx tsx prisma/seed.ts || echo 'El seed de demostracion fallo; la API arranca igual') &&
             node dist/server.js"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./fase-2-desarrollo/mobile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:3000/api/v1
    container_name: kancha-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kancha-db-data:
